server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache PDFs and images at the Cloudflare edge AND in the browser
    # for 6 hours. s-maxage controls the CDN TTL; max-age controls the
    # browser TTL.
    location ~* \.(pdf|png|jpe?g|gif|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=21600, s-maxage=21600" always;
    }
}
